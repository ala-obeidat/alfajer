org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Deployment endpoints baked into BuildConfig. Override per build, e.g.
#   ./gradlew assembleDebug -Palfajer.signalingUrl=http://10.0.2.2:3000 -Palfajer.turnUrls=
alfajer.signalingUrl=https://signaling.alaobeidat.com
alfajer.webUrl=https://alfajer.alaobeidat.com
alfajer.turnUrls=turn:turn.alaobeidat.com:3478?transport=udp,turns:turn.alaobeidat.com:5349?transport=tcp

# App version. Bump versionCode for every build uploaded to a store; CI release
# builds can override both with -Palfajer.versionCode=... -Palfajer.versionName=...
alfajer.versionCode=1
alfajer.versionName=1.0.0
